<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
  <defs>
    <linearGradient id="mapbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="puneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f28c28" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f28c28" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="700" height="350" fill="url(#mapbg)"/>
  <!-- Stylized Continents -->
  <g fill="#1e293b" stroke="#334155" stroke-width="0.8" opacity="0.7">
    <!-- North America -->
    <path d="M70,80 Q100,50 160,60 Q180,90 170,130 Q130,160 100,150 Q70,120 70,80 Z"/>
    <!-- South America -->
    <path d="M140,180 Q180,180 190,230 Q170,290 140,290 Q120,240 140,180 Z"/>
    <!-- Europe -->
    <path d="M280,60 Q340,50 360,90 Q340,120 290,110 Q270,80 280,60 Z"/>
    <!-- Africa -->
    <path d="M280,130 Q350,130 360,190 Q340,260 290,250 Q260,190 280,130 Z"/>
    <!-- Asia -->
    <path d="M370,50 Q480,40 540,90 Q560,160 480,170 Q430,130 370,100 Z"/>
    <!-- India Subcontinent -->
    <path d="M410,130 Q450,130 460,180 Q435,210 415,180 Z" fill="#334155"/>
    <!-- Australia -->
    <path d="M520,210 Q580,210 590,260 Q540,280 510,250 Z"/>
  </g>
  <!-- Pune Origin Hub Coordinates: x=430, y=170 -->
  <circle cx="430" cy="170" r="14" fill="url(#puneGlow)"/>
  <circle cx="430" cy="170" r="4" fill="#ffffff" stroke="#f28c28" stroke-width="2"/>
  <text x="430" y="195" fill="#f28c28" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">PUNE (HUB)</text>
  
  <!-- Export Trade Arcs -->
  <!-- To North America (New York / Chicago: x=140, y=90) -->
  <path d="M430,170 Q280,30 140,90" fill="none" stroke="#f28c28" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="140" cy="90" r="4" fill="#f28c28"/>
  <text x="135" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="end">USA (Air 4d)</text>

  <!-- To Europe (Frankfurt: x=315, y=85) -->
  <path d="M430,170 Q370,90 315,85" fill="none" stroke="#f28c28" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="315" cy="85" r="4" fill="#f28c28"/>
  <text x="310" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="end">Germany / UK</text>

  <!-- To Middle East (Dubai / Saudi: x=375, y=145) -->
  <path d="M430,170 Q400,140 375,145" fill="none" stroke="#f28c28" stroke-width="2"/>
  <circle cx="375" cy="145" r="4" fill="#f28c28"/>
  <text x="365" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="end">UAE / KSA</text>

  <!-- To Southeast Asia (Singapore: x=510, y=185) -->
  <path d="M430,170 Q470,165 510,185" fill="none" stroke="#f28c28" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="510" cy="185" r="4" fill="#f28c28"/>
  <text x="520" y="195" fill="#e2e8f0" font-family="sans-serif" font-size="9">Singapore</text>
</svg>