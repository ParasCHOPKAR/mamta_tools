<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tool" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" fill="url(#cbg)"/>
  <!-- Tool Body -->
  <polygon points="40,60 180,90 180,180 40,210" fill="url(#tool)" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Carbide Insert Gold -->
  <polygon points="170,110 200,95 210,135 180,150" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <!-- Nozzle Port -->
  <circle cx="165" cy="118" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <!-- High Pressure Coolant Jets -->
  <path d="M165,118 Q230,120 360,95" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M165,118 Q240,128 370,130" stroke="#7dd3fc" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M165,118 Q230,138 350,165" stroke="#0ea5e9" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M165,118 Q210,105 320,80" stroke="#bae6fd" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M165,118 Q220,150 330,190" stroke="#0284c7" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- Coolant Mist Overlay -->
  <ellipse cx="260" cy="130" rx="90" ry="50" fill="url(#mist)"/>
  <text x="380" y="35" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="end" font-weight="bold">70 BAR DUAL JETS</text>
  <text x="380" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="end">ΔT -220°C Thermal Shield</text>
</svg>