<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="probe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="ruby" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="cutter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Zeiss logo badge -->
  <rect x="20" y="20" width="60" height="24" rx="4" fill="#003594"/>
  <text x="50" y="37" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">ZEISS</text>
  <!-- Coordinate grid lines -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
  </g>
  <!-- Rotary Table Base -->
  <ellipse cx="200" cy="210" rx="140" ry="25" fill="#334155" stroke="#475569" stroke-width="2"/>
  <ellipse cx="200" cy="205" rx="120" ry="20" fill="#1e293b"/>
  <!-- Cutter Body on Table -->
  <rect x="140" y="150" width="120" height="45" rx="4" fill="url(#cutter)" stroke="#64748b" stroke-width="1.5"/>
  <ellipse cx="200" cy="150" rx="60" ry="12" fill="#e2e8f0"/>
  <!-- Gold Inserts -->
  <polygon points="144,152 154,148 152,162 142,166" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <polygon points="180,154 190,150 188,164 178,168" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <polygon points="216,154 226,150 224,164 214,168" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <polygon points="246,152 256,148 254,162 244,166" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <!-- CMM Vertical Column -->
  <rect x="194" y="20" width="12" height="100" fill="url(#probe)"/>
  <circle cx="200" cy="120" r="10" fill="#475569"/>
  <!-- Probe Styli Stem -->
  <line x1="200" y1="120" x2="200" y2="148" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Ruby Ball Tip Contact -->
  <circle cx="200" cy="148" r="4.5" fill="url(#ruby)" stroke="#7f1d1d" stroke-width="0.5"/>
  <!-- Laser Measurement Beams / Rings -->
  <circle cx="200" cy="148" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
  <circle cx="200" cy="148" r="32" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  <text x="380" y="235" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="end" font-weight="bold">SCAN: &lt; 0.003mm OK</text>
</svg>