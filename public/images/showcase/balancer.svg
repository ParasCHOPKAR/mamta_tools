<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#0f172a"/>
  <!-- Digital Balancing Display Screen -->
  <rect x="25" y="25" width="250" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="150" cy="100" r="50" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="150" cy="100" r="35" fill="none" stroke="#0284c7" stroke-dasharray="4,3"/>
  <circle cx="150" cy="100" r="20" fill="none" stroke="#38bdf8" stroke-width="1"/>
  <!-- Target Center Spot -->
  <circle cx="150" cy="100" r="5" fill="#10b981"/>
  <!-- Crosshairs -->
  <line x1="150" y1="40" x2="150" y2="160" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="90" y1="100" x2="210" y2="100" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="40" y="55" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">BALANCED: G2.5 OK</text>
  <text x="40" y="155" fill="#38bdf8" font-family="monospace" font-size="11">15,000 RPM</text>
  <text x="260" y="155" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="end">0.12 g·mm</text>
</svg>