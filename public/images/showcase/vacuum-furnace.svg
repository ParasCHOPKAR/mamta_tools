<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="vbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="heatglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hotbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#vbg)"/>
  <!-- Furnace Chamber Shell -->
  <rect x="50" y="30" width="300" height="190" rx="16" fill="#27272a" stroke="#3f3f46" stroke-width="3"/>
  <rect x="70" y="50" width="260" height="150" rx="10" fill="#09090b"/>
  <!-- Thermal Radiative Glow -->
  <circle cx="200" cy="125" r="90" fill="url(#heatglow)"/>
  <!-- Heating Elements -->
  <g stroke="#ea580c" stroke-width="2" opacity="0.8">
    <line x1="80" y1="70" x2="320" y2="70"/>
    <line x1="80" y1="90" x2="320" y2="90"/>
    <line x1="80" y1="160" x2="320" y2="160"/>
    <line x1="80" y1="180" x2="320" y2="180"/>
  </g>
  <!-- Glowing Tool Bodies -->
  <rect x="130" y="105" width="140" height="40" rx="4" fill="url(#hotbar)" stroke="#ea580c" stroke-width="2"/>
  <text x="200" y="130" fill="#7c2d12" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">1040°C VACUUM</text>
  <text x="380" y="235" fill="#f97316" font-family="monospace" font-size="11" text-anchor="end" font-weight="bold">HRC 48-52 TOUGHNESS</text>
</svg>