<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="goldInsert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f28c28" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" rx="12"/>
  <circle cx="200" cy="150" r="110" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Cutter Body -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="150" r="95" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="2"/>
    <circle cx="200" cy="150" r="65" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="200" cy="150" r="32" fill="#1e293b"/>
    <!-- Drive keyways -->
    <rect x="188" y="110" width="24" height="16" fill="#1e293b"/>
    <rect x="188" y="174" width="24" height="16" fill="#1e293b"/>
    <!-- Coolant Holes -->
    <circle cx="160" cy="150" r="5" fill="#0284c7"/>
    <circle cx="240" cy="150" r="5" fill="#0284c7"/>
    <circle cx="200" cy="110" r="5" fill="#0284c7"/>
    <circle cx="200" cy="190" r="5" fill="#0284c7"/>
    <!-- Insert Pockets & Inserts at 60deg intervals -->
    <g transform="rotate(0 200 150)"><rect x="272" y="138" width="26" height="24" rx="3" fill="url(#goldInsert)" stroke="#78350f" stroke-width="1.5"/><circle cx="285" cy="150" r="4" fill="#451a03"/></g>
    <g transform="rotate(60 200 150)"><rect x="272" y="138" width="26" height="24" rx="3" fill="url(#goldInsert)" stroke="#78350f" stroke-width="1.5"/><circle cx="285" cy="150" r="4" fill="#451a03"/></g>
    <g transform="rotate(120 200 150)"><rect x="272" y="138" width="26" height="24" rx="3" fill="url(#goldInsert)" stroke="#78350f" stroke-width="1.5"/><circle cx="285" cy="150" r="4" fill="#451a03"/></g>
    <g transform="rotate(180 200 150)"><rect x="272" y="138" width="26" height="24" rx="3" fill="url(#goldInsert)" stroke="#78350f" stroke-width="1.5"/><circle cx="285" cy="150" r="4" fill="#451a03"/></g>
    <g transform="rotate(240 200 150)"><rect x="272" y="138" width="26" height="24" rx="3" fill="url(#goldInsert)" stroke="#78350f" stroke-width="1.5"/><circle cx="285" cy="150" r="4" fill="#451a03"/></g>
    <g transform="rotate(300 200 150)"><rect x="272" y="138" width="26" height="24" rx="3" fill="url(#goldInsert)" stroke="#78350f" stroke-width="1.5"/><circle cx="285" cy="150" r="4" fill="#451a03"/></g>
  </g>
  <!-- Technical Specification Tag -->
  <rect x="20" y="250" width="130" height="28" rx="6" fill="#10243a"/>
  <text x="85" y="268" fill="#f8fafc" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">MT-FM45 SERIES</text>
  <rect x="260" y="250" width="120" height="28" rx="6" fill="#f28c28"/>
  <text x="320" y="268" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">45° APPROACH</text>
</svg>

