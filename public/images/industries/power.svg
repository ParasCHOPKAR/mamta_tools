<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="powerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220" />
      <stop offset="50%" stop-color="#121e30" />
      <stop offset="100%" stop-color="#080e18" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#powerBg)" rx="14"/>

  <!-- Blueprint Coordinate Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="0.8">
    <line x1="50" y1="0" x2="50" y2="240" />
    <line x1="125" y1="0" x2="125" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <line x1="275" y1="0" x2="275" y2="240" />
    <line x1="350" y1="0" x2="350" y2="240" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <line x1="0" y1="180" x2="400" y2="180" />
  </g>

  <!-- Large Power Turbine Outer Casing Ring -->
  <circle cx="200" cy="115" r="80" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="200" cy="115" r="64" fill="#1e293b" stroke="#64748b" stroke-width="1.8"/>

  <!-- Rotor Pitch Bearing Inner Race -->
  <circle cx="200" cy="115" r="42" fill="#0f172a" stroke="#f28c28" stroke-width="2"/>
  <circle cx="200" cy="115" r="22" fill="#070e18" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Pitch Rotor Gear Teeth (Radial Stubs) -->
  <g transform="translate(200, 115)">
    <line x1="0" y1="-64" x2="0" y2="-76" stroke="#f28c28" stroke-width="3"/>
    <line x1="32" y1="-55" x2="38" y2="-66" stroke="#f28c28" stroke-width="3"/>
    <line x1="55" y1="-32" x2="66" y2="-38" stroke="#f28c28" stroke-width="3"/>
    <line x1="64" y1="0" x2="76" y2="0" stroke="#f28c28" stroke-width="3"/>
    <line x1="55" y1="32" x2="66" y2="38" stroke="#f28c28" stroke-width="3"/>
    <line x1="32" y1="55" x2="38" y2="66" stroke="#f28c28" stroke-width="3"/>
    <line x1="0" y1="64" x2="0" y2="76" stroke="#f28c28" stroke-width="3"/>
    <line x1="-32" y1="55" x2="-38" y2="66" stroke="#f28c28" stroke-width="3"/>
    <line x1="-55" y1="32" x2="-66" y2="38" stroke="#f28c28" stroke-width="3"/>
    <line x1="-64" y1="0" x2="-76" y2="0" stroke="#f28c28" stroke-width="3"/>
    <line x1="-55" y1="-32" x2="-66" y2="-38" stroke="#f28c28" stroke-width="3"/>
    <line x1="-32" y1="-55" x2="-38" y2="-66" stroke="#f28c28" stroke-width="3"/>
  </g>

  <!-- Pitch Bearing Bolt Pattern -->
  <circle cx="168" cy="115" r="3" fill="#38bdf8"/>
  <circle cx="232" cy="115" r="3" fill="#38bdf8"/>
  <circle cx="200" cy="83" r="3" fill="#38bdf8"/>
  <circle cx="200" cy="147" r="3" fill="#38bdf8"/>

  <!-- Toolpath Milling Vector -->
  <path d="M 80 115 A 120 120 0 0 1 320 115" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <text x="200" y="32" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">WIND &amp; STEAM TURBINE CASING</text>

  <!-- Telemetry Badges -->
  <rect x="20" y="200" width="160" height="24" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="100" y="216" fill="#f28c28" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">MAT: ALLOY STEEL / FORGINGS</text>

  <rect x="220" y="200" width="160" height="24" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="300" y="216" fill="#38bdf8" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">POWER &amp; ENERGY TURBINES</text>
</svg>
