<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="aeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220" />
      <stop offset="50%" stop-color="#0f1f33" />
      <stop offset="100%" stop-color="#070e1a" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f28c28" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#aeroBg)" rx="14"/>

  <!-- Blueprint Coordinate Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="0.8">
    <line x1="50" y1="0" x2="50" y2="240" />
    <line x1="125" y1="0" x2="125" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <line x1="275" y1="0" x2="275" y2="240" />
    <line x1="350" y1="0" x2="350" y2="240" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <line x1="0" y1="180" x2="400" y2="180" />
  </g>

  <!-- Concentric Blisk Diameter Rings -->
  <circle cx="200" cy="115" r="85" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="5 5" stroke-opacity="0.4"/>
  <circle cx="200" cy="115" r="65" fill="#1e293b" fill-opacity="0.5" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="200" cy="115" r="35" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="200" cy="115" r="16" fill="#1e293b" stroke="#f28c28" stroke-width="1.5"/>

  <!-- Center Arbor Bore with Keyways -->
  <circle cx="200" cy="115" r="8" fill="#070e1a"/>
  <rect x="198" y="103" width="4" height="6" fill="#f28c28"/>
  <rect x="198" y="121" width="4" height="6" fill="#f28c28"/>

  <!-- Turbine Aerofoil Blades (12-Flute Blisk) -->
  <g transform="translate(200, 115)">
    <!-- Blade 1 -->
    <path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/>
    <!-- Blade 2 -->
    <g transform="rotate(30)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
    <!-- Blade 3 -->
    <g transform="rotate(60)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
    <!-- Blade 4 -->
    <g transform="rotate(90)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
    <!-- Blade 5 -->
    <g transform="rotate(120)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
    <!-- Blade 6 -->
    <g transform="rotate(150)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
    <!-- Blade 7 -->
    <g transform="rotate(180)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
    <!-- Blade 8 -->
    <g transform="rotate(210)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
    <!-- Blade 9 -->
    <g transform="rotate(240)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
    <!-- Blade 10 -->
    <g transform="rotate(270)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
    <!-- Blade 11 -->
    <g transform="rotate(300)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
    <!-- Blade 12 -->
    <g transform="rotate(330)"><path d="M 0 -35 C 10 -45 15 -60 12 -75 C 5 -74 2 -65 0 -35" fill="#f28c28" stroke="#fed7aa" stroke-width="0.8"/></g>
  </g>

  <!-- 5-Axis Spiral Toolpath Overlay -->
  <path d="M 120 115 A 80 80 0 0 1 280 115" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" fill="none" opacity="0.7"/>

  <!-- Angle &amp; Dimension Markers -->
  <line x1="80" y1="35" x2="160" y2="35" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="80" cy="35" r="2" fill="#38bdf8"/>
  <text x="120" y="30" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">5-AXIS IMPELLER: ±0.003mm</text>

  <!-- Telemetry Badges -->
  <rect x="20" y="200" width="160" height="24" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="100" y="216" fill="#f28c28" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">MAT: Ti-6Al-4V / INCONEL</text>

  <rect x="220" y="200" width="160" height="24" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="300" y="216" fill="#38bdf8" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">AEROSPACE &amp; DEFENSE</text>
</svg>
